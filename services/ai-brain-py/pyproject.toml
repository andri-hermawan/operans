[project]
name = "ai-brain"
version = "0.1.0"
description = "Layanan AI Brain SIMHA (FastAPI): pustaka SOP, pencarian, dan kelak tanya-jawab bersitasi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "PyJWT[crypto]>=2.9",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# OCR untuk PDF hasil scan (opsional, berat): pip install -e ".[ocr]" lalu OCR_ENABLED=true
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17"]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
